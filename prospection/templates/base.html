<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Prospection{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('accueil') }}" class="logo">Prospection</a>
    <span>
      <a href="{{ url_for('import_fb.page_import') }}" class="bouton-entete">Importer un export Facebook</a>
      <a href="{{ url_for('nouveau') }}">+ Nouveau prospect</a>
    </span>
  </header>
  <main>
    {% for message in get_flashed_messages() %}
      <p class="message">{{ message }}</p>
    {% endfor %}
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
